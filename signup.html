<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        /* Body background */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7f2ff, #d9b4f5); /* light purple gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container card */
        .container {
            width: 350px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(106, 76, 147, 0.2); /* subtle purple shadow */
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #6A4C93; /* deep purple heading */
            font-weight: 700;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #d6c4f0; /* light purple border */
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
			box-sizing: border-box
        }

        input:focus {
            border-color: #6A4C93; /* deep purple focus */
            box-shadow: 0 0 8px rgba(106, 76, 147, 0.3);
            outline: none;
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            background: #6A4C93; /* deep purple */
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #5b3a7c; /* darker purple hover */
        }

        /* Links */
        p {
            text-align: center;
            margin-top: 15px;
            color: #444;
        }

        a {
            text-decoration: none;
            color: #6A4C93; /* purple links */
            font-weight: 600;
        }

        a:hover {
            color: #5b3a7c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create Account</h2>

        <input type="text" id="username" placeholder="Username">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <button onclick="signup()">Sign Up</button>

        <p><a href="login.html">Already have an account? Login</a></p>
    </div>

    <script>
        function signup() {
            let username = document.getElementById("username").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            let formData = new FormData();
            formData.append("username", username);
            formData.append("email", email);
            formData.append("password", password);

            fetch("signup.php", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.status === "success") {
                    window.location.href = "login.html";
                }
            });
        }
    </script>

</body>
</html>
